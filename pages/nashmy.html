<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOVIA - Nashmy AI Assistant</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- CSS Link -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <main class="nashmy-page">

        <!-- Top Header Wave Container -->
        <div class="nashmy-header-wrapper">
            <!-- Glassmorphism Top Bar -->
            <header class="nashmy-top-bar">
                <div class="brand-pill-glass">
                    <a href="home.html" class="brand-link">JOVIA</a>
                    <img class="header-avatar" src="../assets/images/avatar.png" alt="Nashmy" onerror="this.src='avatar.png'">
                </div>

                <div class="language-dropdown-wrapper">
                    <button class="lang-pill-glass" id="langDropdownBtn" type="button">
                        <svg class="globe-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="2" y1="12" x2="22" y2="12"></line>
                            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10z"></path>
                        </svg>
                        <span id="currentLang">English</span>
                    </button>

                    <ul class="language-menu" id="langMenu">
                        <li><button type="button" class="lang-option" data-lang="English">English</button></li>
                        <li><button type="button" class="lang-option" data-lang="العربية">العربية</button></li>
                        <li><button type="button" class="lang-option" data-lang="Español">Español</button></li>
                        <li><button type="button" class="lang-option" data-lang="Français">Français</button></li>
                    </ul>
                </div>
            </header>

            <!-- Curved Organic Top Wave SVG -->
            <div class="top-wave-svg">
                <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
                    <path fill="#F3EBE1" fill-opacity="1" d="M0,160C320,300 1120,40 1440,220L1440,0L0,0Z"></path>
                </svg>
            </div>
        </div>

        <!-- Dynamic Chat Stream Container -->
        <section class="chat-container" id="chatStream">

            <!-- Welcome Message from Nashmy -->
            <div class="chat-row ai-row">
                <img src="../assets/images/avatar.png" alt="Nashmy" class="chat-avatar" onerror="this.src='avatar.png'">
                <div class="ai-bubble">
                    <p>Welcome!<br>Let's explore Jordan's wonders.<br>How can I help you plan your journey today?</p>
                </div>
            </div>

        </section>

        <!-- Bottom Curved Wave Decorative Element -->
        <div class="bottom-wave-svg">
            <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
                <path fill="#F3EBE1" fill-opacity="0.8" d="M0,192C480,280 960,120 1440,224L1440,320L0,320Z"></path>
            </svg>
        </div>

       <!-- Floating Chat Input Bar -->
        <form class="nashmy-input-bar" id="chatForm">
            <!-- Hidden File Input for Attachments & Camera -->
            <input type="file" id="imageUploader" accept="image/*" style="display: none;">

            <button type="button" class="input-btn add-btn" id="attachBtn" aria-label="Add Image/Attachment">+</button>
            <input type="text" id="userInput" placeholder="ASK NASHMY" class="nashmy-text-input" autocomplete="off">
            
            <!-- Dynamic Action Button (Swaps between Mic and Send) -->
            <button type="submit" class="input-btn action-switch-btn" id="actionBtn" aria-label="Send or Voice">
                <!-- Mic Icon (Default State) -->
                <svg class="mic-icon" id="micIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>

                <!-- Send Icon (Hidden when empty) -->
                <svg class="send-icon" id="sendIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </form>

        <!-- Fixed Bottom Navigation Bar -->
        <nav class="bottom-navigation">
            <a href="profile.html" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>Profile</span>
            </a>

            <a href="home.html" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
                <span>Home</span>
            </a>

            <a href="smart-map.html" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
                    <line x1="8" y1="2" x2="8" y2="18"></line>
                    <line x1="16" y1="6" x2="16" y2="22"></line>
                </svg>
                <span>Map</span>
            </a>

            <a href="know-jordan.html" class="nav-item">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <polygon points="12,2 14.1,7.2 19.8,6.1 17.5,11.3 21.8,15 16.1,16.2 15.2,21.9 12,17.2 8.8,21.9 7.9,16.2 2.2,15 6.5,11.3 4.2,6.1 9.9,7.2"></polygon>
                </svg>
                <span>Know JORDAN</span>
            </a>
        </nav>

    </main>

    <!-- External JavaScript File Link -->
    <script src="../js/nashmy.js"></script>
</body>
</html>

</body>

</html>
