    <!-- Interactive Script -->
    <script>
        // Language Dropdown Toggle
        const langDropdownBtn = document.getElementById('langDropdownBtn');
        const langMenu = document.getElementById('langMenu');
        const currentLang = document.getElementById('currentLang');

        langDropdownBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            langMenu.classList.toggle('show');
        });

        document.querySelectorAll('.lang-option').forEach(option => {
            option.addEventListener('click', (e) => {
                currentLang.textContent = e.target.getAttribute('data-lang');
                langMenu.classList.remove('show');
            });
        });

        document.addEventListener('click', () => {
            langMenu.classList.remove('show');
        });

        // Budget Selection & Custom +500 JOD Toggle
        const budgetBtns = document.querySelectorAll('.budget-btn');
        const customWrapper = document.getElementById('customBudgetWrapper');
        const customInput = document.getElementById('customBudgetInput');

        budgetBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                budgetBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                if (btn.id === 'customBudgetBtn') {
                    customWrapper.style.display = 'block';
                    customInput.focus();
                } else {
                    customWrapper.style.display = 'none';
                }
            });
        });

        // Interests Toggle (Multiple Selection Allowed)
        document.querySelectorAll('.interest-pill').forEach(pill => {
            pill.addEventListener('click', () => {
                pill.classList.toggle('active');
            });
        });
    </script>
