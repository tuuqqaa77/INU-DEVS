<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JOVIA - Know Jordan</title>
    <link rel="stylesheet" href="../css/Knowjordan.css">
</head>

<body>

    <main class="know-jordan-page">

        <!-- Header -->
        <header class="know-jordan-header">

            <div class="brand-area">

                <span class="brand-name">
                    JOVIA
                </span>

                <img
                    class="profile-avatar"
                    src="../assets/images/avatar.png"
                    alt="Profile"
                >

            </div>

            <button
                type="button"
                class="search-button"
                aria-label="Search">

                🔍

            </button>

        </header>


        <!-- Page Introduction -->
        <section class="know-jordan-intro">

            <p>
                Discover
            </p>

            <h1>
                Know Jordan
            </h1>

            <p>
                Explore the places, culture and experiences
                that make Jordan special.
            </p>

        </section>


        <!-- Categories -->
        <section class="categories-section">

            <div class="section-heading">

                <h2>
                    Explore
                </h2>

            </div>


            <div class="category-list">

                
<button
                    type="button"
                    class="category-button">

                    <span class="category-icon">
                        <img
                            src="../assets/images/kk1.jpeg"
                            alt="Adventure"
                        >
                    </span>

                    <span>
                        Adventure
                    </span>

                </button>
                <button
                    type="button"
                    class="category-button">

                    <span class="category-icon">
                        <img
                            src="../assets/images/kk2.jpeg"
                            alt="Nature"
                        >
                    </span>

                    <span>
                        Nature
                    </span>

                </button>
                <button
                    type="button"
                    class="category-button">

                    <span class="category-icon">
                        <img
                            src="../assets/images/kk3.jpeg"
                            alt="History"
                        >
                    </span>

                    <span>
                        History
                    </span>

                </button>


                <button
                    type="button"
                    class="category-button">

                    <span class="category-icon">
                        <img
                            src="../assets/images/kk4.jpeg"
                            alt="Food"
                        >
                    </span>

                    <span>
                        Food
                    </span>

                </button>
                <button
                    type="button"
                    class="category-button">

                    <span class="category-icon">
                        <img
                            src="../assets/images/kk5.jpeg"
                            alt="Beaches"
                        >
                    </span>

                    <span>
                        Beaches
                    </span>

                </button>

                <button
                    type="button"
                    class="category-button">

                    <span class="category-icon">
                        <img
                            src="../assets/images/kk6.jpeg"
                            alt="History"
                        >
                    </span>

                    <span>
                        Culture
                    </span>

                </button>
                <button
                    type="button"
                    class="category-button">

                    <span class="category-icon">
                        <img
                            src="../assets/images/kk7.jpeg"
                            alt="Local Experiences"
                        >
                    </span>

                    <span>
                        Local Experiences
                    </span>

                </button>
                <button
                    type="button"
                    class="category-button">

                    <span class="category-icon">
                        <img
                            src="../assets/images/kk8.jpeg"
                            alt="Shopping"
                        >
                    </span>

                    <span>
                        Shopping
                    </span>

                </button>

            </div>

        </section>


        <!-- Featured Places -->
        <section class="featured-places">

            <div class="section-heading">

                <h2>
                    Places to Discover
                </h2>

                <button
                    type="button"
                    class="filter-button">

                    Filter

                </button>

            </div>


            <div class="places-grid">

                <!-- Petra -->
                <article class="place-card">

                    <img
                        src="../assets/images/petra.jpg"
                        alt="Petra">

                    <div class="place-info">

                        <span class="place-category">
                            History
                        </span>

                        <h3>
                            Petra
                        </h3>

                        <p>
                            The Rose City
                        </p>

                        <button
                            type="button"
                            class="save-place-button"
                            aria-label="Save Petra">

                            ♡

                        </button>

                    </div>

                </article>


                <!-- Wadi Rum -->
                <article class="place-card">

                    <img
                        src="../assets/images/wadi-rum.jpg"
                        alt="Wadi Rum">

                    <div class="place-info">

                        <span class="place-category">
                            Nature
                        </span>

                        <h3>
                            Wadi Rum
                        </h3>

                        <p>
                            Valley of the Moon
                        </p>

                        <button
                            type="button"
                            class="save-place-button"
                            aria-label="Save Wadi Rum">

                            ♡

                        </button>

                    </div>

                </article>


                <!-- Jerash -->
                <article class="place-card">

                    <img
                        src="../assets/images/jerash.jpg"
                        alt="Jerash">

                    <div class="place-info">

                        <span class="place-category">
                            History
                        </span>

                        <h3>
                            Jerash
                        </h3>

                        <p>
                            Ancient Roman City
                        </p>

                        <button
                            type="button"
                            class="save-place-button"
                            aria-label="Save Jerash">

                            ♡

                        </button>

                    </div>

                </article>


                <!-- Aqaba -->
                <article class="place-card">

                    <img
                        src="../assets/images/aqaba.jpg"
                        alt="Aqaba">

                    <div class="place-info">

                        <span class="place-category">
                            Sea
                        </span>

                        <h3>
                            Aqaba
                        </h3>

                        <p>
                            The Red Sea
                        </p>

                        <button
                            type="button"
                            class="save-place-button"
                            aria-label="Save Aqaba">

                            ♡

                        </button>

                    </div>

                </article>

            </div>

        </section>


        <!-- Bottom Navigation -->
        <nav class="bottom-navigation">

            <a href="profile.html">
                Profile
            </a>

            <a href="home.html">
                Home
            </a>

            <a href="smart-map.html">
                Map
            </a>

            <a href="know-jordan.html">
                Know Jordan
            </a>

        </nav>

    </main>

</body>

</html>
