<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOVIA - Plan Your Smart Trip</title>

    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS File -->
    <link rel="stylesheet" href="../css/Budget&ExperiencePlanner.css">
</head>
<body>

<div class="app-viewport-wrapper">
    <div class="mobile-frame">

        <!-- الهيدر العلوي -->
        <header class="planner-hero-header">
            <div class="hero-separate-nav">
                <!-- مجموعة اليسار: شعار JOVIA وبجانبه كبسولة نشمي المنفصلة -->
                <div class="left-brand-group">
                    <a href="home.html" class="header-left-brand" style="text-decoration: none;">
                        <span class="brand-box">JOVIA</span>
                    </a>

                    <a href="nashmy.html" class="nashmy-avatar-btn" title="Talk to Nashmy AI">
                        <img src="../assets/nashmy.png" alt="Nashmy AI" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100'">
                    </a>
                </div>
                
                <!-- مجموعة اليمين: زر وقائمة اللغات -->
                <div class="lang-dropdown-container">
                    <button type="button" class="top-btn" id="langSwitchBtn">
                        <i class="fa-solid fa-globe"></i> <span id="currentLangText">English</span> 
                        <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-left: 4px;"></i>
                    </button>
                    <div id="langMenu" class="lang-menu hidden-menu">
                        <div data-lang="English">English</div>
                        <div data-lang="العربية">العربية</div>
                    </div>
                </div>
            </div>

            <!-- تمويجة الهيدر التفاعلية -->
            <div class="wave-container">
                <svg class="animated-wave" viewBox="0 24 150 28" preserveAspectRatio="none">
                    <defs>
                        <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
                    </defs>
                    <g class="parallax-waves">
                        <use href="#gentle-wave" x="48" y="0" fill="rgba(250, 248, 245, 0.3)" />
                        <use href="#gentle-wave" x="48" y="3" fill="rgba(250, 248, 245, 0.6)" />
                        <use href="#gentle-wave" x="48" y="5" fill="#FAF8F5" />
                    </g>
                </svg>
            </div>
        </header>

        <!-- المحتوى الرئيسي للخطوات -->
        <main class="planner-content">
            <h2 class="page-title">Plan Your Smart Trip</h2>

            <!-- Step 1: Budget -->
            <section class="planner-card">
                <div class="card-header">
                    <div class="step-title">
                        <span class="step-number">1</span>
                        <div>
                            <h3>Budget</h3>
                            <p class="step-desc">Tell us: how much are you planning to spend?</p>
                        </div>
                    </div>
                    <i class="fas fa-wallet card-icon"></i>
                </div>

                <div class="budget-options">
                    <button type="button" class="budget-btn" data-value="50">50 JOD</button>
                    <button type="button" class="budget-btn" data-value="100">100 JOD</button>
                    <button type="button" class="budget-btn active" data-value="250">250 JOD</button>
                    <button type="button" class="budget-btn custom-budget-btn" id="customBudgetBtn" data-value="500">+500 JOD</button>
                </div>

                <!-- حقل إدخال الميزانية المخصصة -->
                <div class="custom-budget-container" id="customBudgetContainer" style="display: none; margin-top: 12px; gap: 8px; align-items: center;">
                    <input type="number" id="customBudgetInput" class="custom-budget-input" placeholder="Enter amount (300 - 1500 JOD)..." min="300" max="1500">
                    <button type="button" id="saveCustomBudget" class="custom-budget-save-btn">Apply</button>
                </div>
            </section>

            <!-- Step 2: Trip Details -->
            <section class="planner-card">
                <div class="card-header">
                    <div class="step-title">
                        <span class="step-number">2</span>
                        <div>
                            <h3>Trip Details</h3>
                            <p class="step-desc">How many days? And where do you start?</p>
                        </div>
                    </div>
                    <i class="fas fa-map-marked-alt card-icon"></i>
                </div>

                <div class="details-rows">
                    <!-- Number Of Days -->
                    <div class="detail-row">
                        <span class="detail-label">Number Of Days</span>
                        <div class="detail-select-wrapper">
                            <select id="daysSelect" class="detail-select-pill">
                                <option value="1">1 Day</option>
                                <option value="2">2 Days</option>
                                <option value="3" selected>3 Days</option>
                                <option value="4">4 Days</option>
                                <option value="5">5 Days</option>
                                <option value="7">7 Days</option>
                                <option value="10">10 Days</option>
                            </select>
                            <i class="fas fa-chevron-right select-arrow"></i>
                        </div>
                    </div>

                    <!-- Starting Point -->
                    <div class="detail-row">
                        <span class="detail-label">Starting Point/Arrival</span>
                        <div class="detail-select-wrapper">
                            <select id="startingPointSelect" class="detail-select-pill">
                                <option value="Amman" selected>Amman</option>
                                <option value="Aqaba">Aqaba</option>
                                <option value="Irbid">Irbid</option>
                                <option value="Petra">Petra (Wadi Musa)</option>
                                <option value="Jerash">Jerash</option>
                                <option value="Madaba">Madaba</option>
                            </select>
                            <i class="fas fa-chevron-right select-arrow"></i>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Step 3: Your Interests (6 خيارات مع علامة الصح والظلال) -->
            <section class="planner-card">
                <div class="card-header">
                    <div class="step-title">
                        <span class="step-number">3</span>
                        <div>
                            <h3>Your Interests</h3>
                            <p class="step-desc">What kind of experiences do you enjoy?</p>
                        </div>
                    </div>
                    <i class="fas fa-map-pin card-icon"></i>
                </div>

                <div class="interests-grid">
                    <button type="button" class="interest-chip active" data-interest="Adventure">
                        <i class="fas fa-hiking"></i>
                        <span>Adventure</span>
                    </button>
                    <button type="button" class="interest-chip" data-interest="Local Food">
                        <i class="fas fa-utensils"></i>
                        <span>Local Food</span>
                    </button>
                    <button type="button" class="interest-chip" data-interest="History">
                        <i class="fas fa-landmark"></i>
                        <span>History</span>
                    </button>
                    <button type="button" class="interest-chip" data-interest="Nature">
                        <i class="fas fa-tree"></i>
                        <span>Nature</span>
                    </button>
                    <button type="button" class="interest-chip" data-interest="Relaxation">
                        <i class="fas fa-spa"></i>
                        <span>Relaxation</span>
                    </button>
                    <button type="button" class="interest-chip" data-interest="Culture & Arts">
                        <i class="fas fa-palette"></i>
                        <span>Culture &amp; Arts</span>
                    </button>
                </div>
            </section>

            <!-- Generate CTA Button -->
            <div class="planner-action">
                <button type="button" id="generateTripBtn" class="btn-generate-trip">
                    Generate My Trip <i class="fas fa-sparkles"></i>
                </button>
            </div>
        </main>

        <!-- شريط التنقل السفلي المتجاوب -->
        <nav class="bottom-nav floating-nav">
            <a href="profile.html" class="nav-item">
                <i class="fa-solid fa-user"></i>
                <span>Profile</span>
            </a>
            <a href="home.html" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            <a href="smart-map.html" class="nav-item active">
                <i class="fa-solid fa-compass"></i>
                <span>Map</span>
            </a>
            <a href="know-jordan.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <polygon points="10,0.5 11.74,6.4 17.43,4.08 13.90,9.11 19.26,12.11 13.13,12.49 14.12,18.56 10,14 5.88,18.56 6.87,12.49 0.74,12.11 6.10,9.11 2.57,4.08 8.26,6.40"/>
                </svg>
                <span>Know JORDAN</span>
            </a>
        </nav>

    </div>
</div>

<!-- JavaScript File -->
<script src="../js/Budget&ExperiencePlanner.js"></script>
</body>
</html>
