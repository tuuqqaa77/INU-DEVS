<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOVIA - Create Your Account</title>
  
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- ربط ملف CSS -->
  <link rel="stylesheet" href="/account/account/account.css">
</head>
<body>

  <!-- Page Container -->
  <main class="page-container" style="width: 100%; min-height: 100vh; padding: 0; margin: 0;">
    <div class="app-card" style="width: 100%; min-height: 100vh; background: #FAF8F5; padding: 20px; box-sizing: border-box;">
      
      <!-- الهيدر العلوي الموحد والمتناسق لكل الأجهزة -->
      <div class="login-header" style="display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 15px 15px; box-sizing: border-box; flex-wrap: nowrap; gap: 8px;">
          
          <!-- 1. زر اللغة مع القائمة المنسدلة (على اليمين) -->
          <div class="lang-dropdown-container" style="position: relative; flex-shrink: 0;">
              <button class="top-btn-light" onclick="
                  const menu = document.getElementById('loginLangMenu');
                  menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
              " style="display: flex; align-items: center; justify-content: center; gap: 6px; background: rgba(240, 237, 230, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(0, 0, 0, 0.08); padding: 0 14px; height: 42px; border-radius: 30px; cursor: pointer; font-size: 13px; font-weight: 500; color: #1a1a1a; box-shadow: 0 2px 8px rgba(0,0,0,0.04); box-sizing: border-box;">
                  <i class="fa-solid fa-chevron-down" style="font-size: 9px;"></i> 
                  <span id="current-lang">English</span> 
                  <i class="fa-solid fa-globe"></i>
              </button>
              <div id="loginLangMenu" style="display: none; position: absolute; top: 100%; right: 0; margin-top: 6px; background: #FFFFFF; border: 1px solid #E5E0D8; border-radius: 12px; width: 110px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); z-index: 100; overflow: hidden;">
                  <div style="padding: 8px; text-align: center; cursor: pointer; font-size: 12px; border-bottom: 1px solid #F5F2EC; color: #333;" onclick="document.getElementById('current-lang').innerText='English'; this.parentElement.style.display='none';">English</div>
                  <div style="padding: 8px; text-align: center; cursor: pointer; font-size: 12px; color: #333;" onclick="document.getElementById('current-lang').innerText='العربية'; this.parentElement.style.display='none';">العربية</div>
              </div>
          </div>

          <!-- 2. صندوق JOVIA ونشمي (على اليسار) -->
          <div class="brand-link" style="display: flex; align-items: center; gap: 8px; background: rgba(240, 237, 230, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(0, 0, 0, 0.08); padding: 0 12px 0 6px; height: 42px; border-radius: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); box-sizing: border-box; flex-shrink: 0;">
             <!-- شعار JOVIA -->
              <span class="logo-text" onclick="window.location.href='/index.html'" style="cursor: pointer; font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1rem; letter-spacing: 0.08em; color: #1a1a1a;" title="العودة للرئيسية">JOVIA</span>
              <!-- أفتار نشمي الدائري -->
              <div class="nashmy-mini-avatar" onclick="window.location.href='/nashmy.html'" title="المساعد نشمي" style="cursor: pointer; width: 32px; height: 32px; border-radius: 50%; overflow: hidden; display: flex; justify-content: center; align-items: center; border: 1.5px solid rgba(180, 140, 110, 0.4); flex-shrink: 0;">
                  <img src="/images/nashmy.jpg" alt="Nashmy" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100'">
              </div>
          </div>

      </div>

      <!-- Registration Content -->
      <section class="auth-wrapper">
        <h1 class="heading">Create Your Account</h1>
        <p class="subheading">Join JOVIA to plan your smart trip<br>to Jordan</p>

        <!-- Form Box -->
        <form class="account-form" id="accountForm" onsubmit="event.preventDefault();">
          
          <!-- Full Name -->
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="Enter your full name">
          </div>

          <!-- Email or Phone -->
          <div class="form-group">
            <label for="emailOrPhone">Email or Phone Number</label>
            <input type="text" id="emailOrPhone" placeholder="Enter your Email or Phone Number">
          </div>

          <!-- Password -->
          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-with-icon">
              <input type="password" id="password" placeholder="Enter password (min. 8 characters)">
              <i class="fa-regular fa-eye-slash toggle-password" data-target="password"></i>
            </div>
          </div>

          <!-- Re-Enter Password -->
          <div class="form-group">
            <label for="rePassword">Re- Enter Password</label>
            <div class="input-with-icon">
              <input type="password" id="rePassword" placeholder="Enter password (min. 8 characters)">
              <i class="fa-regular fa-eye-slash toggle-password" data-target="rePassword"></i>
            </div>
          </div>

          <!-- Currency Selector -->
         <div class="custom-dropdown-container" style="position: relative; width: 100%; margin-bottom: 15px;">
    <!-- الحقل الأساسي (نفس تصميم حقول الإدخال والزر الخاص بكِ) -->
    <div id="currencyBtn" onclick="toggleCurrencyMenu()" style="display: flex; justify-content: space-between; align-items: center; background: oklab(86.282% -0.00152 0.01645 / 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(0, 0, 0, 0.08); padding: 14px 18px; border-radius: 16px; cursor: pointer; font-size: 14px; color: #555; box-shadow: 0 2px 8px rgba(0,0,0,0.03); transition: all 0.3s ease;">
        <span id="selectedCurrency" style="color: #666;">Select Currency</span>
        <i class="fa-solid fa-chevron-down" style="font-size: 11px; color: #777; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);" id="currencyArrow"></i>
    </div>

    <!-- القائمة المنسدلة العصرية والزجاجية -->
    <div id="currencyMenu" style="display: none; opacity: 0; transform: translateY(-8px); transition: opacity 0.25s ease, transform 0.25s ease; position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.6); border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.12); z-index: 100; overflow: hidden; padding: 6px;">
        
        <div onclick="selectCurrency('JOD - Jordanian Dinar')" style="padding: 11px 14px; cursor: pointer; font-size: 13.5px; color: #2c2c2c; border-radius: 10px; transition: all 0.2s ease; display: flex; align-items: center; justify-content: space-between;" onmouseover="this.style.background='rgba(168, 90, 67, 0.1)'; this.style.color='#A85A43'" onmouseout="this.style.background='transparent'; this.style.color='#2c2c2c'">
            <span>JOD - Jordanian Dinar</span>
            <i class="fa-solid fa-check" style="font-size: 11px; opacity: 0;" class="check-icon"></i>
        </div>

        <div onclick="selectCurrency('USD - US Dollar')" style="padding: 11px 14px; cursor: pointer; font-size: 13.5px; color: #2c2c2c; border-radius: 10px; transition: all 0.2s ease; display: flex; align-items: center; justify-content: space-between;" onmouseover="this.style.background='rgba(168, 90, 67, 0.1)'; this.style.color='#A85A43'" onmouseout="this.style.background='transparent'; this.style.color='#2c2c2c'">
            <span>USD - US Dollar</span>
        </div>

        <div onclick="selectCurrency('EUR - Euro')" style="padding: 11px 14px; cursor: pointer; font-size: 13.5px; color: #2c2c2c; border-radius: 10px; transition: all 0.2s ease; display: flex; align-items: center; justify-content: space-between;" onmouseover="this.style.background='rgba(168, 90, 67, 0.1)'; this.style.color='#A85A43'" onmouseout="this.style.background='transparent'; this.style.color='#2c2c2c'">
            <span>EUR - Euro</span>
        </div>

        <div onclick="selectCurrency('SAR - Saudi Riyal')" style="padding: 11px 14px; cursor: pointer; font-size: 13.5px; color: #a72323; border-radius: 10px; transition: all 0.2s ease; display: flex; align-items: center; justify-content: space-between;" onmouseover="this.style.background='rgba(168, 90, 67, 0.1)'; this.style.color='#A85A43'" onmouseout="this.style.background='transparent'; this.style.color='#2c2c2c'">
            <span>SAR - Saudi Riyal</span>
        </div>

    </div>
</div>

          <!-- Sign In Button -->
          <button type="submit" class="btn-submit">Sign in</button>

          <!-- Divider -->
          <div class="divider">
            <span>Or continue with</span>
          </div>

          <!-- Social Buttons -->
          <div class="social-login">
            <button type="button" class="btn-social">
              <svg class="google-icon" viewBox="0 0 48 48" width="18" height="18">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.28-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
              </svg>
              <span>Google</span>
            </button>
            <button type="button" class="btn-social">
              <i class="fa-brands fa-apple apple-icon"></i>
              <span>Apple</span>
            </button>
          </div>

        </form>
      </section>

    </div>
  </main>

  <!-- Interactive Chatbot Widget -->
  <div class="chatbot-modal" id="chatbotModal">
    <div class="chatbot-header">
      <div class="chatbot-info">
        <!-- مسار صورتك في مجلد assets -->
        <img src="assets/nnn.jpeg" alt="JOVIA Assistant">
        <div>
          <h4>JOVIA AI Assistant</h4>
          <span class="status-online"><span class="dot"></span> Online</span>
        </div>
      </div>
      <button type="button" class="close-chat" id="closeChatBtn">&times;</button>
    </div>

    <div class="chatbot-messages" id="chatMessages">
      <div class="message bot">
        Hello! 👋 I'm your JOVIA travel assistant for Jordan. How can I help you today?
      </div>
    </div>

    <div class="chatbot-input">
      <input type="text" id="chatInput" placeholder="Ask about trips in Jordan...">
      <button type="button" id="sendMessageBtn"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
  </div>

  <!-- ربط ملف JS حسب مسارك داخل مجلد acounte -->
  <script src="/account/account/accounte.js"></script>
</body>
</html>
