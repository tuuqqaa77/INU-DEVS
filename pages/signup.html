<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOVIA - Sign Up</title>

    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS File -->
    <link rel="stylesheet" href="../css/signup.css">
</head>
<body class="signup-body">

    <div class="app-viewport-wrapper">
        <div class="mobile-frame">
            
            <!-- الهيدر العلوي -->
            <header class="signup-header">
                
                <!-- مجموعة اليسار: الشعار وبجانبه نشمي -->
                <div class="left-brand-group">
                    <a href="onboarding.html" class="header-left-brand">
                        <span class="brand-box">JOVIA</span>
                    </a>

                    <a href="nashmy.html" class="nashmy-mini-avatar" title="Talk to Nashmy AI">
                        <img src="../assets/nashmy.png" alt="Nashmy" >
                    </a>
                </div>

                <!-- زر وقائمة اختيار اللغة على اليمين -->
                <div class="lang-dropdown-container">
                    <button type="button" class="top-btn-light" id="langSwitchBtn">
                        <i class="fa-solid fa-globe"></i> 
                        <span id="current-lang">English</span> 
                        <i class="fa-solid fa-chevron-down arrow-icon"></i>
                    </button>
                    <div id="signupLangMenu" class="lang-menu-dropdown">
                        <div class="lang-opt" data-lang="English">English</div>
                        <div class="lang-opt" data-lang="العربية">العربية</div>
                    </div>
                </div>

            </header>

            <!-- محتوى شاشة إنشاء الحساب -->
            <main class="signup-content">
                
                <div class="welcome-title-area">
                    <h2>Join JOVIA ! 🇯🇴</h2>
                    <p>Create an account to start your smart journey</p>
                </div>

                <!-- Feedback message area -->
                <div id="authMessage" class="auth-message" style="display: none;" role="alert"></div>

                <!-- بطاقة تسجيل البيانات -->
                <div class="signup-card">
                    
                    <div class="input-group">
                        <label for="nameInput">Full Name</label>
                        <input type="text" id="nameInput" placeholder="Enter your full name">
                    </div>

                    <div class="input-group">
                        <label for="emailInput">Email or Phone Number</label>
                        <input type="email" id="emailInput" placeholder="Enter your Email">
                    </div>

                    <div class="input-group">
                        <label for="passwordInput">Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="passwordInput" placeholder="Create a password">
                            <i class="fa-regular fa-eye-slash toggle-password" id="togglePassword"></i>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="confirmPasswordInput">Confirm Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="confirmPasswordInput" placeholder="Confirm your password">
                            <i class="fa-regular fa-eye-slash toggle-password" id="toggleConfirmPassword"></i>
                        </div>
                    </div>

                </div>

                <!-- زر إنشاء الحساب -->
                <button type="button" class="btn-signup" id="signUpBtn">
                    Create Account
                </button>

                <!-- خط الفاصل -->
                <div class="divider">
                    <hr>
                    <span>Or sign up with</span>
                    <hr>
                </div>

                <!-- أزرار الدخول السريع -->
                <div class="social-login">
                    <!-- زر Google -->
                    <button type="button" class="btn-social" id="googleSignUpBtn">
                        <svg viewBox="0 0 48 48" width="18" height="18">
                            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.28-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24s.92 7.54 2.55 10.78l7.98-6.19z"/>
                            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                        </svg>
                        <span>Google</span>
                    </button>

                    <!-- زر Apple -->
                    <button type="button" class="btn-social">
                        <i class="fa-brands fa-apple"></i>
                        <span>Apple</span>
                    </button>
                </div>

                <!-- رابط تسجيل الدخول -->
                <p class="login-prompt">
                    Already have an account? <a href="login.html">Log In</a>
                </p>
            </main>

        </div>
    </div>

    <!-- JavaScript File -->
    <script type="module" src="../js/signup.js"></script>
</body>
</html>
