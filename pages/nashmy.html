<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOVIA - Nashmy Chatbot</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="../css/nashmy.css">
</head>

<body>

    <div class="app-screen">

        <!-- أمواج البحر الناعمة الحقيقية عبر الـ SVG في الخلفية -->
        <div class="bg-waves-container">
            <svg class="wave-svg top-wave-svg" viewBox="0 0 1440 320" preserveAspectRatio="none">
                <path fill="rgba(228, 218, 204, 0.55)"
                    d="M0,160L48,144C96,128,192,96,288,107C384,117,480,171,576,181.3C672,192,768,160,864,138.7C960,117,1056,107,1152,122.7C1248,139,1344,181,1392,202.7L1440,224L1440,0L1392,0C1344,0,1248,0,1152,0C1056,0,960,0,864,0C768,0,672,0,576,0C480,0,384,0,288,0C192,0,96,0,48,0L0,0Z">
                </path>
            </svg>
            <svg class="wave-svg bottom-wave-svg" viewBox="0 0 1440 320" preserveAspectRatio="none">
                <path fill="rgba(228, 218, 204, 0.45)"
                    d="M0,96L48,112C96,128,192,160,288,165.3C384,171,480,149,576,138.7C672,128,768,128,864,144C960,160,1056,192,1152,197.3C1248,203,1344,181,1392,170.7L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z">
                </path>
            </svg>
        </div>

        <!-- الهيدر العلوي -->
        <header class="app-header">
            <!-- زر اللغة متفاعل لتحويل اللغة بين العربية والإنجليزي -->
            <button class="lang-btn" id="langBtn">
                <i class="fa-solid fa-globe"></i>
                <span id="langText">English</span>
                <i class="fa-solid fa-chevron-down" style="font-size: 10px;"></i>
            </button>

            <!-- اسم JOVIA وصورة نشمي ينقلان إلى index.html عند الضغط -->
            <a href="../index.html" class="header-right" style="text-decoration: none; cursor: pointer;">
                <div class="brand-box">JOVIA</div>
                <div class="avatar-circle">
                    <img src="../assets/nashmy.png" alt="Nashmy"
                        onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100';">
                </div>
            </a>
        </header>

        <!-- حاوية المحادثة -->
        <main class="chat-container" id="chatContainer">
            <div class="chat-divider" style="margin-top: 10px;">
                <span class="end-chat-text" id="statusText">Start a conversation with Nashmy</span>
                <div class="date-line-wrapper">
                    <hr class="line">
                    <span class="date-title" id="todayText">Today</span>
                    <hr class="line">
                </div>
            </div>
        </main>

        <!-- صندوق الكتابة السفلي -->
        <div class="input-area-wrapper">
            <div class="chat-input-box">
                <span class="plus-icon">+</span>
                <input type="text" id="userInput" placeholder="ASK NASHMY" autocomplete="off">
                <button type="button" class="mic-send-btn" id="actionBtn" onclick="handleUserSubmit()">
                    <i class="fa-solid fa-microphone" id="inputIcon"></i>
                </button>
            </div>
        </div>

        <!-- شريط التنقل السفلي العائم -->
        <nav class="bottom-nav floating-nav">
            <a href="profile.html" class="nav-item">
                <i class="fa-solid fa-user"></i>
                <span>Profile</span>
            </a>
            <a href="home.html" class="nav-item">
                <i class="fa-solid fa-house"></i>
                <span>Home</span>
            </a>
            <a href="smart-map.html" class="nav-item">
                <i class="fa-solid fa-compass"></i>
                <span>Map</span>
            </a>

            <a href="jordan1.html" class="nav-item active">
                <!-- النجمة السباعية الأردنية — 7 رؤوس بالضبط -->
                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" xmlns="http://www.w3.org/2000/svg"
                    style="display:inline-block; vertical-align:middle; flex-shrink:0;">
                    <polygon points="
                        10,0.5
                        11.74,6.4
                        17.43,4.08
                        13.90,9.11
                        19.26,12.11
                        13.13,12.49
                        14.12,18.56
                        10,14
                        5.88,18.56
                        6.87,12.49
                        0.74,12.11
                        6.10,9.11
                        2.57,4.08
                        8.26,6.40
                    " />
                </svg>
                <span>Know JORDAN</span>
            </a>
        </nav>

    </div>

    <!-- ربط ملف الجافاسكربت في مساره الصحيح داخل مجلد js -->
    <script src="../js/nashmy.js"></script>
</body>

</html>
