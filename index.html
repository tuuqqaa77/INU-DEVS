
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOVIA - Travel & Experiences</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="mobile-frame">
        
        <!-- شاشة البداية (Splash Screen) -->
        <div id="splash-screen" class="splash-screen">
            <h1 class="brand-title-large">JOVIA</h1>
        </div>

        <!-- شاشة الترحيب (Onboarding Screen) -->
        <div id="onboarding-screen" class="onboarding-screen hidden">
            
<!-- الهيدر العلوي الزجاجي الفاخر والمضبوط تماماً -->
<div class="login-header" style="display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 20px 25px; box-sizing: border-box; position: absolute; top: 0; left: 0; z-index: 100;">
    
    <!-- 1. زر اللغة مع القائمة المنسدلة (على اليمين) -->
    <div class="lang-dropdown-container" style="position: relative;">
        <button class="top-btn-light" onclick="
            const menu = document.getElementById('loginLangMenu');
            menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
        " style="display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(255, 255, 255, 0.22); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.35); padding: 0 20px; height: 48px; border-radius: 30px; cursor: pointer; font-size: 14px; font-weight: 500; color: #FFFFFF; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15); transition: all 0.3s ease;">
            <i class="fa-solid fa-globe" style="font-size: 13px;"></i> 
            <span id="current-lang">English</span> 
            <i class="fa-solid fa-chevron-down" style="font-size: 10px; opacity: 0.8;"></i>
        </button>
        <div id="loginLangMenu" style="display: none; position: absolute; top: 100%; right: 0; margin-top: 8px; background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 14px; width: 120px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); z-index: 100; overflow: hidden; padding: 6px;">
            <div style="padding: 10px 12px; text-align: center; cursor: pointer; font-size: 13px; color: #333; border-radius: 8px; transition: background 0.2s;" onclick="document.getElementById('current-lang').innerText='English'; this.parentElement.style.display='none';" onmouseover="this.style.background='rgba(0,0,0,0.05)'" onmouseout="this.style.background='transparent'">English</div>
            <div style="padding: 10px 12px; text-align: center; cursor: pointer; font-size: 13px; color: #333; border-radius: 8px; transition: background 0.2s;" onclick="document.getElementById('current-lang').innerText='العربية'; this.parentElement.style.display='none';" onmouseover="this.style.background='rgba(0,0,0,0.05)'" onmouseout="this.style.background='transparent'">العربية</div>
        </div>
    </div>

    <!-- 2. صندوق JOVIA ونشمي (على اليسار) -->
    <div class="brand-link" style="display: flex; align-items: center; gap: 12px; background: rgba(255, 255, 255, 0.22); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.35); padding: 5px 20px 5px 6px; height: 48px; border-radius: 30px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);">
        <!-- أفتار نشمي الدائري -->
        <div class="nashmy-mini-avatar" onclick="window.location.href='nashmy.html'" title="المساعد نشمي" style="cursor: pointer; width: 36px; height: 36px; border-radius: 50%; overflow: hidden; display: flex; justify-content: center; align-items: center; border: 1.5px solid rgba(255, 255, 255, 0.6); flex-shrink: 0;">
            <img src="images/nashmy.jpg" alt="Nashmy" style="width: 100%; height: 100%; object-fit: cover;" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100'">
        </div>
        <!-- شعار JOVIA -->
        <span class="logo-text" onclick="window.location.href='index.html'" style="cursor: pointer; font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.15rem; letter-spacing: 0.12em; color: #FFFFFF; text-shadow: 0 2px 4px rgba(0,0,0,0.2);" title="العودة للرئيسية">JOVIA</span>
    </div>

</div>

            <!-- شعار التطبيق بالمنتصف -->
            <div class="brand-container">
                <h1 class="brand-title">JOVIA</h1>
                <p class="brand-subtitle">TRAVEL & EXPERIENCES</p>
                <span class="brand-tagline">MORE THAN A TRIP</span>
            </div>

            <!-- أزرار الميزات المتغيرة كل 5 ثوانٍ -->
            <div class="features-container">
                <div class="feature-box active-feature" id="feature-1">
                    <i class="fa-solid fa-wallet"></i>
                    <span>Plan your trip based on budget</span>
                </div>
                <div class="feature-box" id="feature-2">
                    <i class="fa-solid fa-compass"></i>
                    <span>Explore hidden gems</span>
                </div>
                <div class="feature-box" id="feature-3">
                    <i class="fa-solid fa-map-location-dot"></i>
                    <span>Experience the real Jordan</span>
                </div>
            </div>

            <!-- زر البدء بالأسفل -->
            <div class="footer-action">
              <button class="btn-get-started" onclick="window.location.href='login.html'">Get Started</button>
            </div>

        </div>

    </div>

    <!-- ملف الجافاسكريبت -->
    <script src="app.js"></script>
    <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  
  // ضع إعدادات مشروعك هنا
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    // ... باقي الإعدادات
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // ربط زر Sign In الحقيقي
  window.realSignIn = function() {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      
      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
            alert("تم تسجيل الدخول بنجاح للمستخدم: " + userCredential.user.email);
            window.location.href = "home.html"; // الانتقال للصفحة الرئيسية بعد الدخول
        })
        .catch((error) => {
            alert("خطأ في تسجيل الدخول: " + error.message);
        });
  };

  // ربط تسجيل الدخول بـ Google فعلياً
  window.realGoogleLogin = function() {
      const provider = new GoogleAuthProvider();
      signInWithPopup(auth, provider)
        .then((result) => {
            alert("مرحباً بك " + result.user.displayName);
            window.location.href = "home.html";
        }).catch((error) => {
            alert("فشل تسجيل الدخول بـ جوجل: " + error.message);
        });
  };
</script>
</body>
</html>
