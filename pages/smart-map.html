<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JOVIA - Smart Map</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <main class="smart-map-page">

        <!-- Header -->
        <header class="map-header">

            <button
                type="button"
                class="back-button"
                aria-label="Go back">

                ←

            </button>

            <h1>
                Smart Map
            </h1>

            <button
                type="button"
                class="search-button"
                aria-label="Search">

                🔍

            </button>

        </header>


        <!-- Map -->
        <section class="map-container">

            <!--
                The actual interactive map
                will be added later with JavaScript.
            -->

            <div class="map-placeholder">

                <p>
                    Jordan Map
                </p>

            </div>


            <!-- Map Controls -->
            <div class="map-controls">

                <button
                    type="button"
                    class="location-button"
                    aria-label="My location">

                    📍

                </button>

                <button
                    type="button"
                    class="zoom-in-button"
                    aria-label="Zoom in">

                    +

                </button>

                <button
                    type="button"
                    class="zoom-out-button"
                    aria-label="Zoom out">

                    −

                </button>

            </div>


            <!-- Selected Place -->
            <article class="map-place-card">

                <div class="place-card-content">

                    <p class="place-category">
                        Recommended for you
                    </p>

                    <h2>
                        Petra
                    </h2>

                    <p>
                        Discover one of Jordan's most iconic destinations.
                    </p>

                </div>

                <button
                    type="button"
                    class="view-place-button">

                    View Details

                </button>

            </article>

        </section>


        <!-- Bottom Navigation -->
        <nav class="bottom-navigation">

            <a href="profile.html">
                Profile
            </a>

            <a href="home.html">
                Home
            </a>

            <a href="smart-map.html">
                Map
            </a>

            <a href="know-jordan.html">
                Know Jordan
            </a>

        </nav>

    </main>

</body>

</html>
