<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOVIA - Smart Interactive Map</title>

    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Custom CSS (المسار الصحيح بالرجوع خطوة لمجلد css) -->
    <link rel="stylesheet" href="../css/smart-map.css">
</head>

<body>

    <div class="app-viewport-wrapper">
        <div class="mobile-frame">

            <!-- الهيدر العلوي -->
            <header class="map-top-bar">
                <!-- الشعار وبجانبه زر نشمي المحادثة -->
                <div class="left-brand-group">
                    <a href="home.html" class="header-left-brand" style="text-decoration: none;">
                        <span class="brand-box">JOVIA</span>
                    </a>

                    <a href="nashmy.html" class="nashmy-avatar-btn" title="Ask Nashmy AI" style="text-decoration: none;">
                        <img src="../assets/nashmy.png" alt="Nashmy AI"
                            onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100'">
                    </a>
                </div>

                <!-- زر تبديل اللغة -->
                <div class="lang-dropdown-container">
                    <button type="button" class="lang-switch-btn" id="langSwitchBtn">
                        <i class="fa-solid fa-globe"></i> <span>English</span>
                        <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-left: 4px;"></i>
                    </button>
                </div>
            </header>

            <!-- جسم الصفحة: شريط الاختيارات + الخريطة -->
            <main class="map-page-body">

                <!-- شريط يعرض ملخص خيارات المستخدم القادمة من المخطط -->
                <div class="user-selections-bar" id="userSelectionsBar">
                    <div class="selection-chip">
                        <i class="fa-solid fa-location-dot"></i>
                        <span id="summaryCity">Amman</span>
                    </div>
                    <div class="selection-chip">
                        <i class="fa-solid fa-wallet"></i>
                        <span id="summaryBudget">250 JOD</span>
                    </div>
                    <div class="selection-chip">
                        <i class="fa-solid fa-calendar-day"></i>
                        <span id="summaryDays">3 Days</span>
                    </div>
                    <div class="selection-chip">
                        <i class="fa-solid fa-compass"></i>
                        <span id="summaryInterests">Adventure</span>
                    </div>
                </div>

                <!-- رسالة عند عدم وجود مسار مطابق -->
                <div class="no-route-alert" id="noRouteAlert" style="display: none;">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="noRouteText">No predefined route available for this combination.</span>
                </div>

                <!-- حاوية الخريطة التفاعلية -->
                <div id="map"></div>

                <!-- كرت معلومات المسار وزر الحفظ -->
                <div class="route-info-card" id="routeInfoCard" style="display: none;">
                    <div class="route-info-header">
                        <div class="route-info-text">
                            <h3 id="routeName" class="route-name"></h3>
                            <p id="routeMeta" class="route-meta"></p>
                        </div>
                        <button type="button" id="saveRouteBtn" class="btn-save-route" title="Save Route">
                            <i class="fa-regular fa-bookmark" id="saveRouteIcon"></i>
                            <span id="saveRouteText">Save Route</span>
                        </button>
                    </div>
                    <div class="route-stops-list" id="routeStopsList"></div>
                </div>

            </main>

            <!-- نافذة نشمي المنبثقة (Nashmy AI Modal) -->
            <div class="nashmy-modal-overlay" id="nashmyModalOverlay">
                <div class="nashmy-modal-card">
                    <div class="nashmy-modal-header">
                        <div class="nashmy-info">
                            <img src="../assets/nashmy.png" alt="Nashmy AI"
                                onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100'">
                            <div>
                                <h3>Nashmy AI</h3>
                                <p>Your Local Jordan Guide</p>
                            </div>
                        </div>
                        <button type="button" class="close-modal-btn" id="closeNashmyModalBtn">&times;</button>
                    </div>
                    <div class="nashmy-modal-body">
                        <div class="chat-bubble bot">
                            مرحباً بك! أنا نشمي، مسارك السياحي المخصص جاهز على الخريطة. هل تود استكشاف أي نقطة أو تعديل
                            المسار؟
                        </div>
                    </div>
                    <div class="nashmy-modal-footer">
                        <input type="text" placeholder="اسأل نشمي عن أي مكان في المسار...">
                        <button type="button"><i class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>

            <!-- شريط التنقل السفلي -->
            <nav class="bottom-nav floating-nav">
                <a href="profile.html" class="nav-item">
                    <i class="fa-solid fa-user"></i>
                    <span>Profile</span>
                </a>
                <a href="home.html" class="nav-item">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </a>
                <a href="smart-map.html" class="nav-item active">
                    <i class="fa-solid fa-compass"></i>
                    <span>Map</span>
                </a>
                <a href="jordan1.html" class="nav-item">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"
                        xmlns="http://www.w3.org/2000/svg">
                        <polygon
                            points="10,0.5 11.74,6.4 17.43,4.08 13.90,9.11 19.26,12.11 13.13,12.49 14.12,18.56 10,14 5.88,18.56 6.87,12.49 0.74,12.11 6.10,9.11 2.57,4.08 8.26,6.40" />
                    </svg>
                    <span>Know JORDAN</span>
                </a>
            </nav>

        </div>
    </div>

    <!-- Leaflet JS & Map Script -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Map Logic Script -->
    <script src="../js/map.js"></script>

</body>

</html>
