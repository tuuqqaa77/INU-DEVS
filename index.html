
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOVIA - Travel & Experiences</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="mobile-frame">
        
        <!-- شاشة البداية (Splash Screen) -->
        <div id="splash-screen" class="splash-screen">
            <h1 class="brand-title-large">JOVIA</h1>
        </div>

        <!-- شاشة الترحيب (Onboarding Screen) -->
        <div id="onboarding-screen" class="onboarding-screen hidden">
            
            <!-- الهيدر العلوي: تسجيل الدخول، نشمي، واللغات -->
            <!-- الهيدر العلوي المعدل -->
<div class="onboarding-header">
    <div class="left-header-group">
        <!-- زر اللغة مع قائمة منسدلة -->
        <div class="lang-dropdown-container">
            <button class="top-btn" onclick="toggleLangMenu()">
                <i class="fa-solid fa-globe"></i> English <i class="fa-solid fa-chevron-down" style="font-size: 10px; margin-right: 4px;"></i>
            </button>
            <div id="langMenu" class="lang-menu hidden-menu">
                <div onclick="changeLang('English')">English</div>
                <div onclick="changeLang('العربية')">العربية</div>
            </div>
        </div>

        <!-- أفتار نشمي بجانب اللغة -->
        <div class="nashmy-avatar" onclick="alert('الانتقال لصفحة المساعد نشمي')">
            <img src="images/nashmy.jpg" alt="Nashmy" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100'">
        </div>
    </div>

    <!-- زر تسجيل الدخول في اليمين -->
    <button class="top-btn" onclick="window.location.href='login.html'">Sign In</button>
</div>

            <!-- شعار التطبيق بالمنتصف -->
            <div class="brand-container">
                <h1 class="brand-title">JOVIA</h1>
                <p class="brand-subtitle">TRAVEL & EXPERIENCES</p>
                <span class="brand-tagline">MORE THAN A TRIP</span>
            </div>

            <!-- أزرار الميزات المتغيرة كل 5 ثوانٍ -->
            <div class="features-container">
                <div class="feature-box active-feature" id="feature-1">
                    <i class="fa-solid fa-wallet"></i>
                    <span>Plan your trip based on budget</span>
                </div>
                <div class="feature-box" id="feature-2">
                    <i class="fa-solid fa-compass"></i>
                    <span>Explore hidden gems</span>
                </div>
                <div class="feature-box" id="feature-3">
                    <i class="fa-solid fa-map-location-dot"></i>
                    <span>Experience the real Jordan</span>
                </div>
            </div>

            <!-- زر البدء بالأسفل -->
            <div class="footer-action">
              <button class="btn-get-started" onclick="window.location.href='login.html'">Get Started</button>
            </div>

        </div>

    </div>

    <!-- ملف الجافاسكريبت -->
    <script src="app.js"></script>
    <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  
  // ضع إعدادات مشروعك هنا
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    // ... باقي الإعدادات
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // ربط زر Sign In الحقيقي
  window.realSignIn = function() {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      
      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
            alert("تم تسجيل الدخول بنجاح للمستخدم: " + userCredential.user.email);
            window.location.href = "home.html"; // الانتقال للصفحة الرئيسية بعد الدخول
        })
        .catch((error) => {
            alert("خطأ في تسجيل الدخول: " + error.message);
        });
  };

  // ربط تسجيل الدخول بـ Google فعلياً
  window.realGoogleLogin = function() {
      const provider = new GoogleAuthProvider();
      signInWithPopup(auth, provider)
        .then((result) => {
            alert("مرحباً بك " + result.user.displayName);
            window.location.href = "home.html";
        }).catch((error) => {
            alert("فشل تسجيل الدخول بـ جوجل: " + error.message);
        });
  };
</script>
</body>
</html>
