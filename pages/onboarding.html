<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JOVIA - Onboarding</title>

  <!-- خط Cormorant Garamond -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&display=swap" rel="stylesheet">
  
  <!-- مكتبة أيقونات FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- ربط ملف الـ CSS المنفصل -->
  <link rel="stylesheet" href="../css/onboarding.css">
</head>
<body>

  <!-- حاوية الشاشة الرئيسية المتجاوبة -->
  <div class="onboarding-wrapper">
    
    <!-- القسم العلوي: الشعار والعناوين -->
    <header class="header-section">
      <h1 class="brand-title">JOVIA</h1>
      <p class="brand-subtitle">TRAVEL &amp; EXPERIENCES</p>
      <div class="tagline-wrapper">
        <span class="line"></span>
        <span class="tagline">MORE THAN A TRIP</span>
        <span class="line"></span>
      </div>
    </header>

    <!-- القسم الأوسط: الكروت الزجاجية (للعرض فقط) -->
    <main class="features-list">
      
      <!-- الكرت الأول: الميزانية -->
      <div class="feature-pill">
        <div class="pill-icon">
          <i class="fa-solid fa-wallet"></i>
        </div>
        <span class="pill-text">Plan Your Trip Based On Your Budget</span>
      </div>

      <!-- الكرت الثاني: الأماكن المخفية -->
      <div class="feature-pill">
        <div class="pill-icon">
          <i class="fa-regular fa-compass"></i>
        </div>
        <span class="pill-text">Explore Hidden Gems</span>
      </div>

      <!-- الكرت الثالث: تجربة الأردن الحقيقية -->
      <div class="feature-pill">
        <div class="pill-icon">
          <i class="fa-solid fa-map-location-dot"></i>
        </div>
        <span class="pill-text">Experience The Real Jordan</span>
      </div>

    </main>

    <!-- القسم السفلي: زر البدء الوحيد المنوط بالانتقال -->
      <footer class="footer-section">
     <button type="button" class="btn-get-started" id="getStartedBtn" onclick="window.location.href='login.html'">
     Get Started
     </button>
     </footer>

  </div>
  

</body>
</html>
